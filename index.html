<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Monetag Meta Verification Tag -->
    <meta name="monetag" content="19ba1689b71fb81cae3f61d032ddaafe">
    
    <title>Loading Job Vacancy...</title>
    <script type="text/javascript">
        function openAdAndRedirect() {
            // 1. Yahan apna asli Monetag ya Adsterra ka Direct Link lagayein
            window.open("YAHAN_APNA_DIRECT_LINK_LAGAYEIN", "_blank");
            
            // 2. Asli LinkedIn ya Emirates career page ka link jahan user ko bhejna hai
            setTimeout(function() {
                window.location.href = "https://www.emiratesgroupcareers.com/";
            }, 1000);
        }
    </script>
</head>
<body onload="openAdAndRedirect()" style="background:#0F172A; color:#fff; text-align:center; padding-top:100px; font-family:sans-serif;">
    <h2>🔄 Loading Job Details...</h2>
    <p>Please wait while we redirect you to the official vacancy page...</p>
</body>
</html>
